schema_version = 1

[experiment]
name = "joint_goodwin"
system = "goodwin"
description = "Exercise joint library, weak-form, and solver optimization at 10% noise."
methods = ["weak_joint"]
noise_levels = [0.10]
seeds = [11, 22, 33, 44, 55]

[data]
t_start = 0.0
t_end = 100.0
dt = 0.1
train_trajectories = 3
validation_trajectories = 1
test_trajectories = 2
noise_scale = "per_state_standard_deviation"

[truth]
hill_exponent = 9.5

[bounds.library]
gamma_1 = [4.0, 12.0]

[bounds.formulation]
degree = [2, 6]
window_length = [21, 151]
stride = [5, 40]

[bounds.solver]
threshold = [0.001, 0.2]
alpha = [0.000001, 0.1]

[optimizer]
algorithm = "NSGA2"
population = 40
generations = 15
objectives = ["trajectory_mse", "active_coefficients"]

[selection]
metric = "validation_rollout_nrmse"
coefficient_zero_tolerance = 0.000001
