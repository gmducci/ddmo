stages:
  - test
  - release

test:
  stage: test
  image: python:3.11
  before_script:
    - apt-get -qq update
    - apt-get -qq install -y git gfortran libblas-dev liblapack-dev cmake wget
    - python -m pip install --upgrade pip
    - pip install -e .
    - pip install pytest
  script:
    - python -m pytest

release_v1_0_0:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [test]
  rules:
    - if: '$CI_COMMIT_TAG == "v1.0.0"'
  script:
    - echo "Publishing ${CI_COMMIT_TAG} after tests pass"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "ddmo $CI_COMMIT_TAG"
    description: ./RELEASE_NOTES.md
