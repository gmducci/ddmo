stages:
  - test

test:
  stage: test
  image: python:3.11
  before_script:
    - apt-get -qq update
    - apt-get -qq install -y git gfortran libblas-dev liblapack-dev cmake wget
    - python -m pip install --upgrade pip
    - pip install -e .
    - pip install pytest
  script:
    - python -m pytest
